name: Deploy Chrome Extension

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:
    inputs:
      target:
        description: Store item to deploy
        required: true
        type: choice
        options:
          - production
          - dev
      version_bump:
        description: Version segment to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync branch
        shell: bash
        run: |
          git checkout "${{ github.ref_name }}"
          git pull --ff-only origin "${{ github.ref_name }}"

      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.target }}"
          elif [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            TARGET="production"
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            TARGET="dev"
          else
            echo "Unsupported branch: ${{ github.ref_name }}" >&2
            exit 1
          fi

          if [[ "$TARGET" == "production" ]]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "manifest=public/manifest.json" >> "$GITHUB_OUTPUT"
            echo "artifact_name=p21-helper-production" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=v" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "target=dev" >> "$GITHUB_OUTPUT"
            echo "manifest=public/manifest.dev.json" >> "$GITHUB_OUTPUT"
            echo "artifact_name=p21-helper-dev" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=v" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version bump
        id: bump
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "type=${{ inputs.version_bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Chrome Web Store access token
        id: auth
        shell: bash
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID_PROD: ${{ secrets.CWS_EXTENSION_ID_PROD }}
          CWS_EXTENSION_ID_DEV: ${{ secrets.CWS_EXTENSION_ID_DEV }}
        run: |
          required_secrets=(
            CWS_CLIENT_ID
            CWS_CLIENT_SECRET
            CWS_REFRESH_TOKEN
            CWS_PUBLISHER_ID
          )

          if [[ "${{ steps.target.outputs.target }}" == "production" ]]; then
            required_secrets+=(CWS_EXTENSION_ID_PROD)
          else
            required_secrets+=(CWS_EXTENSION_ID_DEV)
          fi

          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if (( ${#missing_secrets[@]} > 0 )); then
            echo "Missing required GitHub secrets: ${missing_secrets[*]}" >&2
            exit 1
          fi

          if ! TOKEN_RESPONSE="$(curl --fail-with-body -sS -X POST "https://oauth2.googleapis.com/token" \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" 2>&1)"; then
            echo "$TOKEN_RESPONSE" >&2
            exit 1
          fi

          ACCESS_TOKEN="$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')"
          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "$TOKEN_RESPONSE" >&2
            exit 1
          fi

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump extension version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const bumpType = process.env.BUMP_TYPE;
          const target = process.env.TARGET;
          const packagePath = 'package.json';
          const packageLockPath = 'package-lock.json';
          const manifestPaths = ['public/manifest.json', 'public/manifest.dev.json'];

          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const writeJson = (path, value) => fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');

          const parseVersion = (value) => {
            const match = String(value || '0.0.0').match(/^(\d+)\.(\d+)\.(\d+)(?:-dev-(\d+))?$/);
            if (!match) {
              throw new Error(`Unsupported version format: ${value}`);
            }

            return {
              major: Number.parseInt(match[1], 10),
              minor: Number.parseInt(match[2], 10),
              patch: Number.parseInt(match[3], 10),
              devNumber: match[4] ? Number.parseInt(match[4], 10) : undefined,
            };
          };

          const bumpBase = (version) => {
            const next = { ...version, devNumber: undefined };
            if (bumpType === 'major') {
              next.major += 1;
              next.minor = 0;
              next.patch = 0;
            } else if (bumpType === 'minor') {
              next.minor += 1;
              next.patch = 0;
            } else {
              next.patch += 1;
            }
            return next;
          };

          const formatBase = (version) => `${version.major}.${version.minor}.${version.patch}`;

          const packageJson = readJson(packagePath);
          const current = parseVersion(packageJson.version);
          const isDevIncrement = target === 'dev' && bumpType === 'patch' && current.devNumber !== undefined;
          const nextBase = isDevIncrement ? current : bumpBase(current);
          const numericVersion = formatBase(nextBase);
          const devNum = isDevIncrement ? current.devNumber + 1 : 1;
          const nextVersion = target === 'dev' ? `${numericVersion}-dev-${devNum}` : numericVersion;
          const manifestVersion = target === 'dev' ? `${numericVersion}.${devNum}` : numericVersion;

          packageJson.version = nextVersion;
          writeJson(packagePath, packageJson);

          if (fs.existsSync(packageLockPath)) {
            const packageLock = readJson(packageLockPath);
            packageLock.version = nextVersion;
            if (packageLock.packages?.['']) {
              packageLock.packages[''].version = nextVersion;
            }
            writeJson(packageLockPath, packageLock);
          }

          for (const manifestPath of manifestPaths) {
            const manifest = readJson(manifestPath);
            manifest.version = manifestVersion;
            if (target === 'dev' && manifestPath.endsWith('manifest.dev.json')) {
              manifest.version_name = nextVersion;
            } else {
              delete manifest.version_name;
            }
            writeJson(manifestPath, manifest);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `manifest_version=${manifestVersion}\n`);
          console.log(`Bumped version to ${nextVersion}`);
          NODE
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          TARGET: ${{ steps.target.outputs.target }}

      - name: Type-check
        run: npm run type-check

      - name: Build extension
        run: npm run build

      - name: Apply selected manifest
        shell: bash
        run: |
          cp "${{ steps.target.outputs.manifest }}" dist/manifest.json
          rm -f dist/manifest.dev.json

      - name: Package extension
        shell: bash
        run: |
          cd dist
          zip -r "../${{ steps.target.outputs.artifact_name }}.zip" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.artifact_name }}
          path: ${{ steps.target.outputs.artifact_name }}.zip
          if-no-files-found: error

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json public/manifest.dev.json
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ steps.target.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        shell: bash
        env:
          CWS_EXTENSION_ID_PROD: ${{ secrets.CWS_EXTENSION_ID_PROD }}
          CWS_EXTENSION_ID_DEV: ${{ secrets.CWS_EXTENSION_ID_DEV }}
        run: |
          if [[ "${{ steps.target.outputs.target }}" == "production" ]]; then
            EXTENSION_ID="$CWS_EXTENSION_ID_PROD"
          else
            EXTENSION_ID="$CWS_EXTENSION_ID_DEV"
          fi

          if ! UPLOAD_RESPONSE="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${{ steps.target.outputs.artifact_name }}.zip" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/$EXTENSION_ID:upload" 2>&1)"; then
            echo "$UPLOAD_RESPONSE" >&2
            exit 1
          fi

          echo "$UPLOAD_RESPONSE"
          UPLOAD_STATE="$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadState // empty')"

          for attempt in {1..10}; do
            if [[ "$UPLOAD_STATE" != "IN_PROGRESS" ]]; then
              break
            fi

            sleep 15
            if ! STATUS_RESPONSE="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
              "https://chromewebstore.googleapis.com/v2/publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/$EXTENSION_ID:fetchStatus" 2>&1)"; then
              echo "$STATUS_RESPONSE" >&2
              exit 1
            fi
            echo "$STATUS_RESPONSE"
            UPLOAD_STATE="$(echo "$STATUS_RESPONSE" | jq -r '.lastAsyncUploadState // empty')"
          done

          if [[ "$UPLOAD_STATE" == "IN_PROGRESS" || "$UPLOAD_STATE" == "FAILED" ]]; then
            echo "Upload did not complete successfully. Final state: $UPLOAD_STATE" >&2
            exit 1
          fi

      - name: Submit for review
        shell: bash
        env:
          CWS_EXTENSION_ID_PROD: ${{ secrets.CWS_EXTENSION_ID_PROD }}
          CWS_EXTENSION_ID_DEV: ${{ secrets.CWS_EXTENSION_ID_DEV }}
        run: |
          if [[ "${{ steps.target.outputs.target }}" == "production" ]]; then
            EXTENSION_ID="$CWS_EXTENSION_ID_PROD"
          else
            EXTENSION_ID="$CWS_EXTENSION_ID_DEV"
          fi

          if ! PUBLISH_RESPONSE="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/$EXTENSION_ID:publish" 2>&1)"; then
            echo "$PUBLISH_RESPONSE" >&2
            exit 1
          fi

          echo "$PUBLISH_RESPONSE"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          files: ${{ steps.target.outputs.artifact_name }}.zip
          generate_release_notes: true
