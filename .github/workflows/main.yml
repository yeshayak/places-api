name: Build

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - master
      - dev

jobs:
  build:
    name: Type-check and build extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: p21-helper-build
          path: dist
          if-no-files-found: error
